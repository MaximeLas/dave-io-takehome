name: neo4j-infra-knowledge-graph-homework

services:
  neo4j:
    build:
      context: .
      dockerfile: Dockerfile
    image: neo4j-infra-knowledge-graph-homework:local
    container_name: neo4j-infra-knowledge-graph-homework
    environment:
      NEO4J_AUTH: neo4j/homework-password
      NEO4J_dbms_security_auth__minimum__password__length: 5
    ports:
      - '7474:7474'
      - '7687:7687'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "/var/lib/neo4j/bin/cypher-shell -a bolt://localhost:7687 -u neo4j -p neo4j 'RETURN 1' >/dev/null 2>&1 || /var/lib/neo4j/bin/cypher-shell -a bolt://localhost:7687 -u neo4j -p homework-password 'RETURN 1' >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: 'no'

  seed:
    image: neo4j-infra-knowledge-graph-homework:local
    depends_on:
      neo4j:
        condition: service_healthy
    entrypoint: ['/bin/bash', '-lc']
    command:
      - |
        /var/lib/neo4j/bin/cypher-shell -a bolt://neo4j:7687 -u neo4j -p homework-password --file /var/lib/neo4j/import/mock-infra.cypher
        /var/lib/neo4j/bin/cypher-shell -a bolt://neo4j:7687 -u neo4j -p homework-password \
          "ALTER USER neo4j SET PASSWORD 'neo4j' CHANGE NOT REQUIRED"
        /var/lib/neo4j/bin/cypher-shell -a bolt://neo4j:7687 -u neo4j -p neo4j \
          "MATCH (n:Entity) RETURN count(n) AS entities"
    restart: 'no'
